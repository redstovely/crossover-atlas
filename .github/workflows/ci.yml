name: verify

on:
  push:
  pull_request:

jobs:
  smoke-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Smoke test
        run: python run_all.py smoke
      - name: Numeric audit vs published values
        run: python run_all.py audit
